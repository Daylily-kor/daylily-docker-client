syntax = "proto3";

option go_package = "github.com/Daylily-kor/daylily-docker-client/proto/helloworld";
option java_multiple_files =true;
option java_package = "com.daylily.proto";
option java_outer_classname = "HelloworldProto";

service Greeter {
  rpc SayHello (HelloReq) returns (HelloResp);
}

message HelloReq {
  string name = 1;
}

message HelloResp {
  string message = 1;
  int32 code = 2;
  string error = 3;
}