syntax = "proto3";

package com.daylily.pb;

option go_package = "github.com/Daylily-kor/daylily-grpc-server/pb/build";
option java_multiple_files = true;
option java_package = "com.daylily.proto.build";

message GrpcImageBuildRequest {
  string repository_name = 1;
  string ref = 2;
  int32 pr_number = 3;
  string sha =  4;
}

message GrpcImageBuildResponse {
  string image_id = 1;
  string image_name = 2;
  string image_tag = 3;
}
