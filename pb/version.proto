syntax = "proto3";

package com.daylily.pb;

option go_package = "github.com/Daylily-kor/daylily-grpc-server/pb/version";
option java_multiple_files = true;
option java_package = "com.daylily.proto.version";

message GrpcDockerVersionResponse {
  string version = 1;
  string api_version = 2;
  string platform = 3;
  string os = 4;
  string arch = 5;
  string kernel_version = 6;
}
